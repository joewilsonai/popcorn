<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popcorn</title>
<link rel="stylesheet" href="/ext/overlay.css">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0810; color: #eee; font: 15px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; }
  header a { color: #ff9ad5; text-decoration: none; font-weight: 700; }
  #title { color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #stage { position: relative; width: min(100vw - 32px, (100vh - 120px) * 16 / 9); aspect-ratio: 16 / 9; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
  #stage:fullscreen { width: 100vw; border-radius: 0; }
  #player, #player iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { display: flex; justify-content: center; gap: 10px; padding: 12px; }
  button.fs { background: #241730; color: #fff; border: 1px solid #4a2b55; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<header><a href="/">🍿 Popcorn</a><span id="title"></span><a id="yt" target="_blank" rel="noopener">Open on YouTube ↗</a></header>
<div id="stage"><div id="player"></div></div>
<div class="bar"><button class="fs" id="fs">Fullscreen with facts</button></div>
<script src="/ext/overlay.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("v");
  const stage = document.getElementById("stage");
  document.getElementById("yt").href = `https://www.youtube.com/watch?v=${id}`;
  // YouTube's own fullscreen would hide our layer, so fullscreen the stage instead.
  document.getElementById("fs").onclick = () => stage.requestFullscreen();

  let player = null, poll = null;
  const ui = Popcorn.create(stage, {
    getTime: () => (player && player.getCurrentTime ? player.getCurrentTime() : null),
    seek: (t) => player && player.seekTo(t, true),
    onResearch: async (force) => {
      ui.setStatus({ state: "researching", step: "Starting" });
      const r = await fetch("/api/research", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: `https://www.youtube.com/watch?v=${id}`, force: !!force }) });
      const st = await r.json().catch(() => ({}));
      if (!r.ok || st.state === "error") return ui.setStatus({ state: "error", step: st.step || st.error || "" });
      load();
    },
    onRetry: () => load(),
  });

  async function load() {
    clearTimeout(poll);
    try {
      const r = await fetch(`/api/facts/${id}`);
      const d = await r.json();
      if (!r.ok || !d.status) return ui.setStatus({ state: "error", step: d.error || "not found" });
      if (d.title) document.getElementById("title").textContent = d.title;
      if (d.facts && d.facts.length) ui.setFacts(d);
      if (!d.facts || !d.facts.length || d.status.state === "researching") ui.setStatus(d.status);
      if (d.status.state === "researching") poll = setTimeout(load, 4000);
    } catch { ui.setStatus({ state: "offline" }); }
  }

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("player", { videoId: id, playerVars: { fs: 0, rel: 0, modestbranding: 1, playsinline: 1 } });
  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
  load();
</script>
</body>
</html>
